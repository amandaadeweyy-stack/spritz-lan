<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; gap: 14px; }
  .grid { display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn-primary { background: #FFB900; color: #0B0B0B; padding: 15px 28px; border-radius: 6px; font-size: 14px; font-weight: 800; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; }
  .btn-primary svg { width: 15px; height: 15px; }
  .btn-secondary { background: transparent; color: #fff; padding: 14px 26px; border-radius: 6px; font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,0.15); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .btn-pill { background: #FFB900; color: #0B0B0B; padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .btn-pill svg { width: 14px; height: 14px; }
  .hover { background: #FFCB3D; box-shadow: 0 12px 32px rgba(255,185,0,0.28); transform: translateY(-2px); }
  .lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; color: rgba(255,255,255,0.5); text-transform: uppercase; min-width: 90px; }
</style></head>
<body>
<div class="grid">
  <div class="row"><span class="lbl">Primary</span>
    <button class="btn-primary">Request Walkthrough <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <button class="btn-primary hover">Hover state <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
  <div class="row"><span class="lbl">Secondary</span>
    <button class="btn-secondary"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 4.18 2 2 0 015.06 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L9.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>Call 514-677-8390</button>
  </div>
  <div class="row"><span class="lbl">Nav pill</span>
    <button class="btn-pill">Get a Walkthrough <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
</div>
</body></html>
