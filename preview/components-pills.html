<!doctype html>
<html><head><meta charset="utf-8"><title>Pills & Badges</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; gap: 16px; align-items: flex-start; justify-content: flex-start; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; color: rgba(255,255,255,0.5); text-transform: uppercase; min-width: 100px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(255,185,0,0.08); border: 1px solid rgba(255,185,0,0.25); border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--spritz-gold); }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--spritz-gold); }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.30); font-size: 10px; font-weight: 700; color: #4ADE80; letter-spacing: 0.04em; }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; }
  .corner { padding: 6px 14px; background: var(--spritz-gold); color: #0B0B0B; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; border-radius: 6px; text-transform: uppercase; }
  .ann { padding: 8px 14px; background: var(--spritz-gold); color: #0B0B0B; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:14px;width:100%">
  <div class="row"><span class="lbl">Eyebrow</span><span class="eyebrow"><span class="dot"></span>Now Serving Greater Montréal</span></div>
  <div class="row"><span class="lbl">Status</span><span class="status"><span class="dot"></span>Active</span></div>
  <div class="row"><span class="lbl">Form Badge</span><span class="corner">Free Walkthrough</span></div>
  <div class="row"><span class="lbl">Announcement</span><span class="ann"><b>Now booking Q3 2025</b> · Bilingual service</span></div>
</div>
</body></html>
