<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: 12px; padding: 12px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); color: #fff; }
  .n { font-size: 11px; font-weight: 800; }
  .h { font-size: 10px; font-weight: 600; font-family: var(--font-mono); opacity: 0.6; }
  .lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5; }
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#0B0B0B">
    <div class="lbl">PAGE BG</div>
    <div><div class="n">Black</div><div class="h">#0B0B0B</div></div>
  </div>
  <div class="sw" style="background:#1A1A1A">
    <div class="lbl">SECTION ALT</div>
    <div><div class="n">Charcoal</div><div class="h">#1A1A1A</div></div>
  </div>
  <div class="sw" style="background:#222">
    <div class="lbl">CARD</div>
    <div><div class="n">Slate</div><div class="h">#222222</div></div>
  </div>
  <div class="sw" style="background:#2A2A2A">
    <div class="lbl">ELEVATED</div>
    <div><div class="n">Slate 2</div><div class="h">#2A2A2A</div></div>
  </div>
</div>
</body></html>
