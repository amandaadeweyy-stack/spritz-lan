<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Headings</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; gap: 18px; align-items: flex-start; justify-content: flex-start; }
  .row { display: grid; grid-template-columns: 140px 1fr; align-items: baseline; gap: 24px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .meta { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); text-transform: uppercase; font-family: var(--font-mono); }
  .h2 { font-size: 40px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; }
  .h3 { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .h4 { font-size: 18px; font-weight: 700; line-height: 1.3; }
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:6px;width:100%">
  <div class="row"><div class="meta">H2 · 900 · 40</div><div class="h2">A structured partner.</div></div>
  <div class="row"><div class="meta">H3 · 800 · 22</div><div class="h3">Cleanliness compounds.</div></div>
  <div class="row"><div class="meta">H4 · 700 · 18</div><div class="h4">Creates a strong first impression</div></div>
</div>
</body></html>
