<!doctype html>
<html><head><meta charset="utf-8"><title>Icon Pills</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; gap: 18px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; justify-items: center; }
  .icon-pill { display: flex; align-items: center; justify-content: center; background: rgba(255,185,0,0.08); border: 1px solid rgba(255,185,0,0.18); color: var(--spritz-gold); }
  .icon-pill.solid { background: var(--spritz-gold); border: none; color: #0B0B0B; }
  .icon-pill svg { width: 50%; height: 50%; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.5); text-align: center; margin-top: 6px; font-weight: 600; }
  .col { display: flex; flex-direction: column; align-items: center; }
</style></head>
<body>
<div class="grid">
  <div class="col">
    <div class="icon-pill" style="width:32px;height:32px;border-radius:50%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
    <div class="meta">32 · circle</div>
  </div>
  <div class="col">
    <div class="icon-pill" style="width:40px;height:40px;border-radius:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    <div class="meta">40 · r10</div>
  </div>
  <div class="col">
    <div class="icon-pill" style="width:48px;height:48px;border-radius:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <div class="meta">48 · r12</div>
  </div>
  <div class="col">
    <div class="icon-pill" style="width:56px;height:56px;border-radius:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
    <div class="meta">56 · r14</div>
  </div>
  <div class="col">
    <div class="icon-pill solid" style="width:56px;height:56px;border-radius:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg></div>
    <div class="meta">solid · feature</div>
  </div>
</div>
</body></html>
