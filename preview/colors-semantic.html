<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic Colors</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { padding: 18px; border-radius: 12px; background: #1A1A1A; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; width: fit-content; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .n { font-size: 11px; font-weight: 800; }
  .h { font-family: var(--font-mono); font-size: 10px; opacity: 0.6; }
</style></head>
<body>
<div class="grid">
  <div class="card">
    <div class="pill" style="background:rgba(34,197,94,0.10);border:1px solid rgba(34,197,94,0.30);color:#4ADE80">
      <span class="dot" style="background:#4ADE80"></span>Active
    </div>
    <div>
      <div class="n" style="color:#4ADE80">Success</div>
      <div class="h">#4ADE80 · text · #4ADE80<br>bg · rgba(34,197,94,0.10)</div>
    </div>
  </div>
  <div class="card">
    <div class="pill" style="background:rgba(255,185,0,0.08);border:1px solid rgba(255,185,0,0.25);color:#FFB900">
      <span class="dot" style="background:#FFB900"></span>Now Serving
    </div>
    <div>
      <div class="n" style="color:#FFB900">Accent / Eyebrow</div>
      <div class="h">text · #FFB900<br>bg · rgba(255,185,0,0.08)</div>
    </div>
  </div>
</div>
</body></html>
