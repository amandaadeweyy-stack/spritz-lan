<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Scale</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; gap: 6px; align-items: flex-start; justify-content: flex-start; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: 70px 70px 1fr; align-items: baseline; gap: 18px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .row:last-child { border-bottom: 0; }
  .sz { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 600; }
  .wt { font-family: var(--font-mono); font-size: 10px; color: var(--spritz-gold); font-weight: 700; }
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:0;width:100%">
  <div class="row"><span class="sz">76 / 1.0</span><span class="wt">900</span><span style="font-size:36px;font-weight:900;letter-spacing:-0.025em;line-height:1">Display</span></div>
  <div class="row"><span class="sz">56 / 1.05</span><span class="wt">900</span><span style="font-size:28px;font-weight:900;letter-spacing:-0.02em">Section H2</span></div>
  <div class="row"><span class="sz">22 / 1.2</span><span class="wt">800</span><span style="font-size:20px;font-weight:800">Card title</span></div>
  <div class="row"><span class="sz">17 / 1.65</span><span class="wt">400</span><span style="font-size:16px;font-weight:400;color:rgba(255,255,255,0.72)">Lead paragraph copy</span></div>
  <div class="row"><span class="sz">15 / 1.65</span><span class="wt">400</span><span style="font-size:14px;font-weight:400;color:rgba(255,255,255,0.72)">Body copy</span></div>
  <div class="row"><span class="sz">11 / .20em</span><span class="wt">700</span><span style="font-size:11px;font-weight:700;letter-spacing:0.20em;text-transform:uppercase;color:var(--spritz-gold)">KICKER</span></div>
</div>
</body></html>
