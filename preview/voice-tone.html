<!doctype html>
<html><head><meta charset="utf-8"><title>Voice & Tone</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; gap: 14px; align-items: flex-start; justify-content: flex-start; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .do, .dont { padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .do { background: rgba(255,185,0,0.06); border-color: rgba(255,185,0,0.2); }
  .dont { background: rgba(255,255,255,0.02); }
  .head { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
  .head.do { color: var(--spritz-gold); background: none; border: none; padding: 0; }
  .head.dont { color: rgba(255,255,255,0.5); background: none; border: none; padding: 0; }
  .quote { font-size: 14px; font-weight: 700; line-height: 1.4; color: #fff; }
  .dont .quote { color: rgba(255,255,255,0.5); text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.3); }
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:10px;width:100%">
  <div class="row">
    <div class="do"><span class="head do">✓ Spritz voice</span><span class="quote">Commercial cleaning, elevated.</span></div>
    <div class="dont"><span class="head dont">✗ Off-brand</span><span class="quote">Best-in-class cleaning solutions!</span></div>
  </div>
  <div class="row">
    <div class="do"><span class="head do">✓ Spritz voice</span><span class="quote">We don't lock people in — if it's not working, you can leave.</span></div>
    <div class="dont"><span class="head dont">✗ Off-brand</span><span class="quote">We pride ourselves on world-class service 🌟</span></div>
  </div>
  <div class="row">
    <div class="do"><span class="head do">✓ Spritz voice</span><span class="quote">Cleanliness compounds.</span></div>
    <div class="dont"><span class="head dont">✗ Off-brand</span><span class="quote">Reach out today to learn more!</span></div>
  </div>
</div>
</body></html>
