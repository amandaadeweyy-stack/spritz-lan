<!doctype html>
<html><head><meta charset="utf-8"><title>Spritz Gold</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; height: 100%; }
  .sw { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 96px; border: 1px solid var(--line); }
  .sw .n { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; }
  .sw .h { font-size: 11px; font-weight: 700; font-family: var(--font-mono); opacity: 0.75; }
  .sw .label { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#FFB900;color:#0B0B0B">
    <div class="label">PRIMARY · BRAND</div>
    <div><div class="n">Spritz Gold</div><div class="h">#FFB900</div></div>
  </div>
  <div class="sw" style="background:#FFCB3D;color:#0B0B0B">
    <div class="label">HOVER</div>
    <div><div class="n">Gold Hover</div><div class="h">#FFCB3D</div></div>
  </div>
  <div class="sw" style="background:#D99E00;color:#0B0B0B">
    <div class="label">PRESSED</div>
    <div><div class="n">Gold Deep</div><div class="h">#D99E00</div></div>
  </div>
</div>
</body></html>
