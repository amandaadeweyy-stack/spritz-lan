<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spritz Commercial Cleaning — UI Kit</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sections.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Logo.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="CtaForm.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
  const { useEffect } = React;
  const { LangProvider } = window.SpritzI18n;
  const { AnnouncementBar, Nav } = window.SpritzNav;
  const { Hero } = window.SpritzHero;
  const { LogoStrip, WhyItMatters, Differentiators, Process, Industries, FAQ } = window.SpritzSections;
  const { CtaForm } = window.SpritzCta;
  const { Footer } = window.SpritzFooter;

  function App() {
    useEffect(() => {
      const io = new IntersectionObserver(
        (entries) => entries.forEach((e) => e.isIntersecting && e.target.classList.add("visible")),
        { threshold: 0.15 }
      );
      document.querySelectorAll(".spritz-reveal, .spritz-stagger").forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);

    return (
      <div data-screen-label="Marketing Site">
        <AnnouncementBar />
        <Nav />
        <Hero />
        <LogoStrip />
        <WhyItMatters />
        <Differentiators />
        <Process />
        <Industries />
        <FAQ />
        <CtaForm />
        <Footer />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    <LangProvider><App /></LangProvider>
  );
</script>
</body>
</html>
